[package]
name = "kanbanban"
description = "A fast, modal, terminal-based Kanban board."
authors = ["Luiz Otavio Vilas Boas Oliveira <luiz.vbo@gmail.com>"]
license = "MIT"
readme = "README.md"
version = "1.0.0"
edition = "2024"
repository = "https://github.com/luizvbo/kanbanban"
keywords = ["kanban", "tui", "productivity", "terminal", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "*.log",
    ".github/*",
    "tests/*"
]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.55", features = ["derive"] }
crossterm = "0.29.0"
pulldown-cmark = "0.13.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"

[dev-dependencies]
tempfile = "3.24.0"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.typos.default.extend-words]
ratatui = "ratatui"

[[bin]]
name = "kbb"
path = "src/main.rs"
