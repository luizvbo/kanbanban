[package]
name = "kanbanban"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/luizvbo/kanbanban"

[dependencies]
ratatui = "0.29"
tui-textarea = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"
directories = "6.0.0"
serde_yaml = "0.9.34"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.4"

[dev-dependencies]
tempfile = "3.23.0"

[profile.dist]
inherits = "release"
lto = "thin"
